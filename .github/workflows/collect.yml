name: Collect Mekong evidence
on:
  schedule:
    - cron: '40 15 * * *' # 09:40 Chicago in winter; 10:40 in summer
  workflow_dispatch:
    inputs:
      max_records:
        description: Maximum additions (at most 20)
        default: '20'
      dry_run:
        description: Collect and report without saving
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: mekong-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix collector --ignore-scripts --no-audit --no-fund
      - name: Collect and independently review
        id: collect
        run: node collector/collect.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          MAX_RECORDS: ${{ inputs.max_records || '20' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
      - run: node scripts/check.mjs && node scripts/build-pages.mjs
      - name: Commit and deploy
        id: publish
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add public/data/archive.json public/config.json collection-runs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Mekong collection and source review log'
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - name: Verify live records
        if: ${{ steps.publish.outputs.published == 'true' && steps.collect.outputs.added != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDS: ${{ steps.collect.outputs.ids }}
        run: |
          sleep 20
          run_id=$(gh run list --workflow pages.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run watch "$run_id" --exit-status --interval 15
          for attempt in 1 2 3 4 5 6; do
            curl -fsS "https://sadiulchyon.github.io/mekong-sand-watch/data/archive.json?t=$(date +%s)" -o "$RUNNER_TEMP/live.json" && node -e 'const fs=require("fs"),a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/live.json")),ids=new Set(a.records.map(r=>r.id)),missing=process.env.IDS.split(",").filter(x=>x&&!ids.has(x));console.log(`${a.records.length} live records; ${missing.length} missing`);process.exit(missing.length?1:0)' && exit 0
            sleep 30
          done
          echo '::error::New records are not on the live site'; exit 1
