<svg xmlns="http://www.w3.org/2000/svg" width="620" height="620" viewBox="0 0 620 620" role="img" aria-labelledby="title desc">
<title id="title">Mekong basin guide</title><desc id="desc">A schematic of the Mekong from China through the mainland Southeast Asian countries to the delta in Viet Nam. This is not a geographic map or a map of extraction sites.</desc>
<defs><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#8a6f45" stroke-opacity=".13"/></pattern></defs>
<rect width="620" height="620" fill="url(#grid)"/>
